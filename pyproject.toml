[project]
name = "python-middleware-recipes"
version = "0.1.0"
description = "Copy-paste Genkit Python middleware recipes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "genkit>=0.8",
    "genkit-plugin-middleware>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
